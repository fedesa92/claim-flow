quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173,http://localhost:4173,http://localhost:3000
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.mongodb.connection-string=${MONGODB_URI:mongodb://localhost:27017}
quarkus.mongodb.database=claimflow
mp.messaging.outgoing.claim-events.connector=smallrye-kafka
mp.messaging.outgoing.claim-events.topic=claim-events
mp.messaging.outgoing.claim-events.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=ClaimFlow API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Event-driven demonstration API for motor claims and loss adjuster appointment booking
