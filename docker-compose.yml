services:
  web:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [api]

  api:
    build: ./backend
    ports: ["8080:8080"]
    environment:
      MONGODB_URI: mongodb://mongo:27017
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
    depends_on:
      mongo: { condition: service_healthy }
      redpanda: { condition: service_healthy }

  mongo:
    image: mongo:8.0
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 15

  redpanda:
    image: redpandadata/redpanda:v25.2.10
    command: ["redpanda", "start", "--overprovisioned", "--smp", "1", "--memory", "512M", "--reserve-memory", "0M", "--node-id", "0", "--kafka-addr", "PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092", "--advertise-kafka-addr", "PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092"]
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 5s
      timeout: 3s
      retries: 15

  console:
    image: redpandadata/console:v3.2.2
    ports: ["8081:8080"]
    environment:
      KAFKA_BROKERS: redpanda:29092
    depends_on: [redpanda]

volumes:
  mongo-data:
